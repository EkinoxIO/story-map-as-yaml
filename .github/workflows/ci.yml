name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code: no write access for the workflow token.
permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm test

      - name: Check the committed build is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::editor/dist is out of date: run 'npm run build' in editor/ and commit the result."
            exit 1
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Validate the sample story map (schema and references)
        run: ../scripts/validate.sh
